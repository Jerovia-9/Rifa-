<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#d63384" />
  <title>Registro de Ventas · Jerovia N°9</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(145deg, #fdf6f9 0%, #fff0f5 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 2rem;
      color: #2d2d2d;
      -webkit-font-smoothing: antialiased;
    }
    .rainbow-bar {
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, #D8303B, #F58634, #FFE61C, #00A859, #00AFEF, #0065A0, #727CB6);
      background-size: 300% 100%;
      animation: arcoirisMove 6s ease-in-out infinite alternate;
      box-shadow: 0 2px 12px rgba(216, 48, 59, 0.2);
      flex-shrink: 0;
    }
    @keyframes arcoirisMove {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    .container {
      width: 100%;
      max-width: 600px;
      padding: 1.5rem 1rem 0;
      margin: 0 auto;
    }
    .header { text-align: center; margin-bottom: 1.2rem; }
    .header .subtitle {
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 0.65rem;
      color: #d63384;
      background: rgba(214, 51, 132, 0.08);
      display: inline-block;
      padding: 0.25rem 1rem;
      border-radius: 50px;
      margin-bottom: 0.5rem;
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.9rem;
      color: #1a1a1a;
      line-height: 1.15;
      margin-bottom: 0.2rem;
    }
    .header h1 span {
      background: linear-gradient(135deg, #d63384, #b82a6e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header .tagline {
      font-weight: 400;
      font-size: 0.85rem;
      color: #7a6a72;
      line-height: 1.3;
      margin-top: 0.2rem;
    }
    .header .tagline strong { font-weight: 600; color: #d63384; }

    .form-section {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 1.2rem 1rem 1.5rem;
      box-shadow: 0 8px 30px -10px rgba(214,51,132,0.15);
      border: 1px solid rgba(255,255,255,0.6);
    }
    .form-group { display: flex; flex-direction: column; margin-bottom: 1rem; }
    .form-group:last-of-type { margin-bottom: 0; }
    .form-group label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #a08a94;
      margin-bottom: 0.3rem;
      padding-left: 0.2rem;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 0.95rem 1rem;
      border: 2px solid #f0dce4;
      border-radius: 14px;
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      background: white;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      color: #2d2d2d;
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #d63384;
      box-shadow: 0 0 0 4px rgba(214, 51, 132, 0.1);
    }
    .form-group input::placeholder { color: #c4b3bb; font-size: 0.9rem; }

    /* Selector custom de vendedora */
    .selector-vendedora {
      width: 100%;
      padding: 0.95rem 1rem;
      border: 2px solid #f0dce4;
      border-radius: 14px;
      background: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      color: #2d2d2d;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-height: 54px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .selector-vendedora:active { transform: scale(0.99); }
    .selector-vendedora:focus {
      outline: none;
      border-color: #d63384;
      box-shadow: 0 0 0 4px rgba(214, 51, 132, 0.1);
    }
    .selector-vendedora.vacio { color: #c4b3bb; }

    /* Modal de selección */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
      padding: 0;
    }
    .modal-overlay.activo { display: flex; }
    .modal-content {
      background: white;
      width: 100%;
      max-width: 600px;
      border-radius: 24px 24px 0 0;
      padding: 1.2rem 1rem 2rem;
      max-height: 80vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-titulo {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 2px solid #fce4ec;
    }
    .modal-opcion {
      width: 100%;
      padding: 1rem;
      border: 2px solid #f0dce4;
      border-radius: 14px;
      background: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      color: #2d2d2d;
      text-align: left;
      margin-bottom: 0.6rem;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 54px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .modal-opcion:active { transform: scale(0.98); background: #fce4ec; }
    .modal-opcion.seleccionada {
      border-color: #d63384;
      background: #fce4ec;
      font-weight: 600;
    }
    .modal-cerrar {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 14px;
      background: #f5e8ee;
      color: #a08a94;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .radio-group { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.2rem; }
    .radio-option {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 1rem 1rem;
      background: white;
      border: 2px solid #f0dce4;
      border-radius: 14px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-size: 0.95rem;
      line-height: 1.2;
      -webkit-user-select: none;
      user-select: none;
    }
    .radio-option:active { transform: scale(0.985); }
    .radio-option.selected {
      border-color: #d63384;
      background: #fce4ec;
      box-shadow: 0 0 0 3px rgba(214,51,132,0.08);
    }
    .radio-option input[type="radio"] {
      accent-color: #d63384;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .btn-registrar {
      background: linear-gradient(135deg, #d63384, #b82a6e);
      color: white;
      border: none;
      padding: 1.1rem 1.5rem;
      border-radius: 60px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 6px 18px rgba(214, 51, 132, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      margin-top: 1.2rem;
      min-height: 54px;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    .btn-registrar:active { transform: scale(0.97); }
    .btn-registrar:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .mensaje {
      margin-top: 1rem;
      padding: 1rem 1.2rem;
      border-radius: 14px;
      display: none;
      align-items: flex-start;
      gap: 0.6rem;
      font-weight: 500;
      font-size: 0.9rem;
      line-height: 1.35;
      animation: fadeSlideUp 0.35s ease forwards;
    }
    .mensaje.exito { display: flex; background: #e8f5e9; color: #2e7d32; border-left: 5px solid #2e7d32; }
    .mensaje.error { display: flex; background: #ffebee; color: #c62828; border-left: 5px solid #c62828; }
    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .aviso-rango {
      display: none;
      margin-top: 0.4rem;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 0.45rem 0.8rem;
      border-radius: 10px;
      line-height: 1.3;
    }
    .aviso-rango.ok { display: block; background: #e8f5e9; color: #2e7d32; }
    .aviso-rango.error { display: block; background: #ffebee; color: #c62828; }

    .footer {
      width: 100%;
      max-width: 600px;
      margin-top: 1.8rem;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 400;
      color: #b8a4ae;
      letter-spacing: 0.5px;
      padding: 0 1rem;
    }
    .footer .rainbow-dots {
      display: inline-flex;
      gap: 5px;
      margin-bottom: 0.4rem;
    }
    .footer .rainbow-dots span {
      width: 7px; height: 7px; border-radius: 50%; display: inline-block;
    }
    .footer strong { color: #d63384; font-weight: 500; }
    .footer p { line-height: 1.5; }

    /* Input file estilizado */
    input[type="file"] {
      font-size: 0.85rem;
      padding: 0.7rem;
      border: 2px dashed #f0dce4;
      border-radius: 14px;
      background: #faf5f8;
      width: 100%;
    }
    input[type="file"]::file-selector-button {
      padding: 0.5rem 1rem;
      border-radius: 10px;
      border: none;
      background: #fce4ec;
      color: #d63384;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 0.8rem;
      margin-right: 0.6rem;
      cursor: pointer;
    }

    /* Pantallas muy chicas */
    @media (max-width: 380px) {
      .header h1 { font-size: 1.6rem; }
      .form-section { padding: 1rem 0.8rem 1.2rem; }
      .radio-option { font-size: 0.88rem; padding: 0.85rem 0.8rem; }
    }

    /* Pantallas grandes / escritorio */
    @media (min-width: 641px) {
      body { padding-top: 2rem; }
      .container { padding: 2rem 1.5rem 0; }
      .header h1 { font-size: 2.4rem; }
      .form-section { padding: 2rem 1.8rem; border-radius: 30px; }
    }
  </style>
</head>
<body>

  <div class="rainbow-bar"></div>

  <div class="container">
    <header class="header">
      <div class="subtitle">✦ Asamblea Jerovia N°9 ✦</div>
      <h1>Registro de <span>Ventas</span></h1>
      <p class="tagline">Completá los datos y tu venta queda registrada</p>
    </header>

    <section class="form-section">
      <form id="formVenta">
        <div class="form-group">
          <label>Vendedora</label>
          <button type="button" id="btnVendedora" class="selector-vendedora vacio">
            <span id="vendedoraTexto">-- Seleccioná tu nombre --</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d63384" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <input type="hidden" id="vendedora" required />
          <div id="avisoRango" class="aviso-rango"></div>
        </div>

        <div class="form-group">
          <label for="numero">Número vendido</label>
          <input type="number" id="numero" inputmode="numeric" min="1" placeholder="Ej: 42" required />
        </div>

        <div class="form-group">
          <label for="cliente">Nombre del comprador</label>
          <input type="text" id="cliente" placeholder="Ej: María González" required />
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono del comprador</label>
          <input type="tel" id="telefono" inputmode="tel" placeholder="Ej: 0981 123 456" required />
        </div>

        <div class="form-group">
          <label>Comprobante de pago</label>
          <div class="radio-group">
            <label class="radio-option" id="optFoto">
              <input type="radio" name="tipoPago" value="foto" checked />
              <span>📷 Subir foto del comprobante</span>
            </label>
            <label class="radio-option" id="optEfectivo">
              <input type="radio" name="tipoPago" value="efectivo" />
              <span>💵 Entregaré el dinero en efectivo</span>
            </label>
          </div>
          <div id="grupoFoto" style="margin-top:0.7rem;">
            <input type="file" id="foto" accept="image/*" capture="environment" />
          </div>
        </div>

        <button type="submit" class="btn-registrar" id="btnRegistrar">
          <span>Registrar venta</span>
        </button>

        <div id="mensaje" class="mensaje"></div>
      </form>
    </section>

    <footer class="footer">
      <div class="rainbow-dots">
        <span style="background:#D8303B;"></span>
        <span style="background:#F58634;"></span>
        <span style="background:#FFE61C;"></span>
        <span style="background:#00A859;"></span>
        <span style="background:#00AFEF;"></span>
        <span style="background:#0065A0;"></span>
        <span style="background:#727CB6;"></span>
      </div>
      <p>Orden Internacional del Arcoíris para Niñas · <strong>Asamblea Jerovia N°9</strong> · Paraguay</p>
      <p style="margin-top:0.2rem; opacity:0.6;">© 2026 · Fe · Esperanza · Caridad</p>
    </footer>
  </div>

  <!-- Modal de selección de vendedora -->
  <div class="modal-overlay" id="modalVendedora">
    <div class="modal-content">
      <div class="modal-titulo">Elegí tu nombre</div>
      <div id="listaVendedoras"></div>
      <button type="button" class="modal-cerrar" id="cerrarModal">Cancelar</button>
    </div>
  </div>

  <script>
    const URL_SCRIPT = "https://script.google.com/macros/s/TU_ID_DE_SCRIPT/exec";

    let rangos = [];
    let vendidos = [];

    function cargarDatos() {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonpCallback_' + Date.now();
        window[callbackName] = function(data) {
          rangos = data.rangos;
          vendidos = data.vendidos;

          // Llenar la lista del modal
          const lista = document.getElementById('listaVendedoras');
          lista.innerHTML = '';
          rangos.forEach(r => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'modal-opcion';
            btn.innerHTML = `<span>${r.nombre}</span><span style="color:#d63384;font-size:0.8rem;">${r.inicio}-${r.fin}</span>`;
            btn.addEventListener('click', () => {
              seleccionarVendedora(r.nombre);
              cerrarModal();
            });
            lista.appendChild(btn);
          });

          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
          resolve();
        };

        const script = document.createElement('script');
        script.src = URL_SCRIPT + '?action=datos&callback=' + callbackName;
        script.onerror = function() {
          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
          reject(new Error('Error al cargar datos'));
        };
        document.body.appendChild(script);
      });
    }

    // Abrir modal
    document.getElementById('btnVendedora').addEventListener('click', () => {
      document.getElementById('modalVendedora').classList.add('activo');
    });

    // Cerrar modal
    document.getElementById('cerrarModal').addEventListener('click', cerrarModal);
    document.getElementById('modalVendedora').addEventListener('click', (e) => {
      if (e.target.id === 'modalVendedora') cerrarModal();
    });

    function cerrarModal() {
      document.getElementById('modalVendedora').classList.remove('activo');
    }

    function seleccionarVendedora(nombre) {
      document.getElementById('vendedora').value = nombre;
      const texto = document.getElementById('vendedoraTexto');
      texto.textContent = nombre;
      document.getElementById('btnVendedora').classList.remove('vacio');

      // Marcar opción seleccionada en el modal
      document.querySelectorAll('.modal-opcion').forEach(btn => {
        btn.classList.toggle('seleccionada', btn.querySelector('span').textContent === nombre);
      });

      // Mostrar rango
      const aviso = document.getElementById('avisoRango');
      const r = rangos.find(x => x.nombre === nombre);
      if (r) {
        aviso.textContent = `Tus números van del ${r.inicio} al ${r.fin}`;
        aviso.className = 'aviso-rango ok';
      }
    }

    document.getElementById('numero').addEventListener('input', (e) => {
      const aviso = document.getElementById('avisoRango');
      const nombre = document.getElementById('vendedora').value;
      const num = parseInt(e.target.value);
      if (!nombre || !num) { aviso.className = 'aviso-rango'; return; }
      const r = rangos.find(x => x.nombre === nombre);
      if (!r) return;
      if (num < r.inicio || num > r.fin) {
        aviso.textContent = `❌ Ese número no te corresponde. Tus números van del ${r.inicio} al ${r.fin}.`;
        aviso.className = 'aviso-rango error';
      } else if (vendidos.includes(num)) {
        aviso.textContent = `❌ Ese número ya fue registrado.`;
        aviso.className = 'aviso-rango error';
      } else {
        aviso.textContent = `✅ Número disponible.`;
        aviso.className = 'aviso-rango ok';
      }
    });

    document.querySelectorAll('input[name="tipoPago"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        document.querySelectorAll('.radio-option').forEach(el => el.classList.remove('selected'));
        e.target.closest('.radio-option').classList.add('selected');
        const grupoFoto = document.getElementById('grupoFoto');
        grupoFoto.style.display = e.target.value === 'foto' ? 'block' : 'none';
      });
    });
    document.getElementById('optFoto').classList.add('selected');

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('formVenta').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnRegistrar');
      const mensajeDiv = document.getElementById('mensaje');

      const vendedora = document.getElementById('vendedora').value;
      const numero = parseInt(document.getElementById('numero').value);
      const cliente = document.getElementById('cliente').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const tipoPago = document.querySelector('input[name="tipoPago"]:checked').value;
      const fotoInput = document.getElementById('foto');

      if (!vendedora) { mostrarMensaje('Seleccioná tu nombre.', 'error'); return; }
      if (!numero) { mostrarMensaje('Ingresá el número vendido.', 'error'); return; }
      if (!cliente) { mostrarMensaje('Ingresá el nombre del comprador.', 'error'); return; }
      if (!telefono) { mostrarMensaje('Ingresá el teléfono del comprador.', 'error'); return; }

      const r = rangos.find(x => x.nombre === vendedora);
      if (numero < r.inicio || numero > r.fin) {
        mostrarMensaje(`Ese número no te corresponde. Tus números van del ${r.inicio} al ${r.fin}.`, 'error');
        return;
      }
      if (vendidos.includes(numero)) {
        mostrarMensaje('Ese número ya fue registrado.', 'error');
        return;
      }
      if (tipoPago === 'foto' && !fotoInput.files[0]) {
        mostrarMensaje('Subí la foto del comprobante o elegí "Entregaré el dinero en efectivo".', 'error');
        return;
      }

      let imagenBase64 = null;
      let imagenNombre = null;
      if (tipoPago === 'foto' && fotoInput.files[0]) {
        imagenBase64 = await fileToBase64(fotoInput.files[0]);
        imagenNombre = fotoInput.files[0].name;
      }

      const payload = {
        vendedora,
        numero,
        cliente,
        telefono,
        tipoPago,
        imagenBase64,
        imagenNombre
      };

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span><span>Registrando...</span>';
      mensajeDiv.style.display = 'none';

      try {
        await fetch(URL_SCRIPT, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        mostrarMensaje(`✅ Número ${numero} vendido a ${cliente} — Pendiente. ¡Gracias!`, 'exito');
        document.getElementById('numero').value = '';
        document.getElementById('cliente').value = '';
        document.getElementById('telefono').value = '';
        document.getElementById('foto').value = '';
        document.getElementById('avisoRango').className = 'aviso-rango';
        document.getElementById('numero').focus();
        await cargarDatos();
      } catch (error) {
        console.error(error);
        mostrarMensaje('Hubo un problema al registrar. Verificá tu conexión e intentá de nuevo.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Registrar venta</span>';
      }
    });

    function mostrarMensaje(texto, tipo) {
      const div = document.getElementById('mensaje');
      div.textContent = texto;
      div.className = 'mensaje ' + tipo;
      div.style.display = 'flex';
      setTimeout(() => { div.style.display = 'none'; }, 8000);
    }

    cargarDatos().catch(err => {
      console.error(err);
      mostrarMensaje('No se pudieron cargar los datos. Verificá la URL del script.', 'error');
    });
  </script>
</body>
</html>
