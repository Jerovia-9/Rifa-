<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Ventas · Jerovia N°9</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(145deg, #fdf6f9 0%, #fff0f5 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      color: #2d2d2d;
    }
    .rainbow-bar {
      width: 100%;
      max-width: 820px;
      height: 6px;
      border-radius: 20px 20px 0 0;
      background: linear-gradient(90deg, #D8303B, #F58634, #FFE61C, #00A859, #00AFEF, #0065A0, #727CB6);
      background-size: 300% 100%;
      animation: arcoirisMove 6s ease-in-out infinite alternate;
      margin: 0 auto;
      box-shadow: 0 4px 20px rgba(216, 48, 59, 0.2);
    }
    @keyframes arcoirisMove {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    .container {
      max-width: 820px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 0 0 40px 40px;
      box-shadow: 0 30px 60px -20px rgba(214, 51, 132, 0.25), 0 10px 30px -10px rgba(0,0,0,0.05);
      padding: 2.5rem 2.5rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .header { text-align: center; margin-bottom: 2rem; }
    .header .subtitle {
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-size: 0.75rem;
      color: #d63384;
      background: rgba(214, 51, 132, 0.08);
      display: inline-block;
      padding: 0.25rem 1.2rem;
      border-radius: 50px;
      margin-bottom: 0.75rem;
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 2.4rem;
      color: #1a1a1a;
      line-height: 1.1;
      margin-bottom: 0.3rem;
    }
    .header h1 span {
      background: linear-gradient(135deg, #d63384, #b82a6e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header .tagline {
      font-weight: 300;
      font-size: 1rem;
      color: #7a6a72;
      letter-spacing: 0.5px;
      margin-top: 0.25rem;
    }
    .header .tagline strong { font-weight: 600; color: #d63384; }

    .form-section {
      background: rgba(255, 255, 255, 0.5);
      border-radius: 30px;
      padding: 2rem 1.8rem;
      box-shadow: inset 0 1px 4px rgba(255,255,255,0.8), 0 8px 20px rgba(214,51,132,0.06);
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
    }
    .form-grid .full { grid-column: 1 / -1; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #a08a94;
      margin-bottom: 0.35rem;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 0.85rem 1rem;
      border: 2px solid #f0dce4;
      border-radius: 16px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      background: white;
      transition: all 0.25s ease;
      outline: none;
      color: #2d2d2d;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #d63384;
      box-shadow: 0 0 0 6px rgba(214, 51, 132, 0.08), 0 4px 12px rgba(214,51,132,0.1);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.3rem;
    }
    .radio-option {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1rem;
      background: white;
      border: 2px solid #f0dce4;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }
    .radio-option:hover { border-color: #f8bbd0; }
    .radio-option.selected {
      border-color: #d63384;
      background: #fce4ec;
      box-shadow: 0 0 0 4px rgba(214,51,132,0.06);
    }
    .radio-option input[type="radio"] { accent-color: #d63384; width: 18px; height: 18px; }

    .btn-registrar {
      background: linear-gradient(135deg, #d63384, #b82a6e);
      color: white;
      border: none;
      padding: 0.95rem 2.6rem;
      border-radius: 60px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(214, 51, 132, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      margin-top: 1.5rem;
    }
    .btn-registrar:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 14px 30px rgba(214, 51, 132, 0.4);
    }
    .btn-registrar:active { transform: scale(0.96); }
    .btn-registrar:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .mensaje {
      margin-top: 1.2rem;
      padding: 1rem 1.4rem;
      border-radius: 16px;
      display: none;
      align-items: center;
      gap: 0.8rem;
      font-weight: 500;
      font-size: 0.95rem;
      animation: fadeSlideUp 0.4s ease forwards;
    }
    .mensaje.exito { display: flex; background: #e8f5e9; color: #2e7d32; border-left: 5px solid #2e7d32; }
    .mensaje.error { display: flex; background: #ffebee; color: #c62828; border-left: 5px solid #c62828; }
    .mensaje.info { display: flex; background: #fff3e0; color: #e65100; border-left: 5px solid #e65100; }
    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .aviso-rango {
      display: none;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.4rem 0.8rem;
      border-radius: 10px;
    }
    .aviso-rango.ok { display: block; background: #e8f5e9; color: #2e7d32; }
    .aviso-rango.error { display: block; background: #ffebee; color: #c62828; }

    .footer {
      max-width: 820px;
      width: 100%;
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 400;
      color: #b8a4ae;
      letter-spacing: 0.8px;
      border-top: 1px solid rgba(214, 51, 132, 0.08);
      padding-top: 1.8rem;
    }
    .footer .rainbow-dots {
      display: inline-flex;
      gap: 6px;
      margin-bottom: 0.5rem;
    }
    .footer .rainbow-dots span {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block;
    }
    .footer strong { color: #d63384; font-weight: 500; }

    @media (max-width: 640px) {
      .container { padding: 1.5rem 1.2rem; border-radius: 0 0 28px 28px; }
      .header h1 { font-size: 1.8rem; }
      .form-grid { grid-template-columns: 1fr; }
      .form-section { padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>

  <div class="rainbow-bar"></div>

  <div class="container">
    <header class="header">
      <div class="subtitle">✦ Asamblea Jerovia N°9 ✦</div>
      <h1>Registro de <span>Ventas</span></h1>
      <p class="tagline">Completá los datos y tu venta queda registrada · <strong>Fe</strong> y <strong>comunidad</strong></p>
    </header>

    <section class="form-section">
      <form id="formVenta">
        <div class="form-grid">
          <div class="form-group full">
            <label for="vendedora">Vendedora</label>
            <select id="vendedora" required>
              <option value="">-- Seleccioná tu nombre --</option>
            </select>
            <div id="avisoRango" class="aviso-rango"></div>
          </div>
          <div class="form-group">
            <label for="numero">Número vendido</label>
            <input type="number" id="numero" min="1" placeholder="Ej: 42" required />
          </div>
          <div class="form-group">
            <label for="cliente">Nombre del comprador</label>
            <input type="text" id="cliente" placeholder="Ej: María González" required />
          </div>
          <div class="form-group full">
            <label for="telefono">Teléfono del comprador</label>
            <input type="tel" id="telefono" placeholder="Ej: 0981 123 456" required />
          </div>
          <div class="form-group full">
            <label>Comprobante de pago</label>
            <div class="radio-group">
              <label class="radio-option" id="optFoto">
                <input type="radio" name="tipoPago" value="foto" checked />
                <span>📷 Subir foto del comprobante</span>
              </label>
              <label class="radio-option" id="optEfectivo">
                <input type="radio" name="tipoPago" value="efectivo" />
                <span>💵 Entregaré el dinero en efectivo</span>
              </label>
            </div>
            <div id="grupoFoto" style="margin-top:0.8rem;">
              <input type="file" id="foto" accept="image/*" />
            </div>
          </div>
        </div>

        <button type="submit" class="btn-registrar" id="btnRegistrar">
          <span>Registrar venta</span>
        </button>

        <div id="mensaje" class="mensaje"></div>
      </form>
    </section>
  </div>

  <footer class="footer">
    <div class="rainbow-dots">
      <span style="background:#D8303B;"></span>
      <span style="background:#F58634;"></span>
      <span style="background:#FFE61C;"></span>
      <span style="background:#00A859;"></span>
      <span style="background:#00AFEF;"></span>
      <span style="background:#0065A0;"></span>
      <span style="background:#727CB6;"></span>
    </div>
    <p>Orden Internacional del Arcoíris para Niñas · <strong>Asamblea Jerovia N°9</strong> · Paraguay</p>
    <p style="margin-top:0.2rem; opacity:0.5;">© 2026 · Fe · Esperanza · Caridad</p>
  </footer>

<script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzcOh4Nfivkj7tqo1JJRMhG3mu7SrbBCJeSthwY0jr7fmIQEPck62J2YwNqyCJoYt0Y3g/exec";

    let rangos = [];
    let vendidos = [];

    // Cargar datos con JSONP (evita CORS)
    function cargarDatos() {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonpCallback_' + Date.now();
        window[callbackName] = function(data) {
          rangos = data.rangos;
          vendidos = data.vendidos;

          const select = document.getElementById('vendedora');
          // Limpiar select (dejar solo la opción por defecto)
          select.innerHTML = '<option value="">-- Seleccioná tu nombre --</option>';
          rangos.forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.nombre;
            opt.textContent = r.nombre;
            select.appendChild(opt);
          });

          delete window[callbackName];
          document.body.removeChild(script);
          resolve();
        };

        const script = document.createElement('script');
        script.src = URL_SCRIPT + '?action=datos&callback=' + callbackName;
        script.onerror = function() {
          delete window[callbackName];
          document.body.removeChild(script);
          reject(new Error('Error al cargar datos'));
        };
        document.body.appendChild(script);
      });
    }

    document.getElementById('vendedora').addEventListener('change', (e) => {
      const aviso = document.getElementById('avisoRango');
      const nombre = e.target.value;
      if (!nombre) { aviso.className = 'aviso-rango'; return; }
      const r = rangos.find(x => x.nombre === nombre);
      if (r) {
        aviso.textContent = `Tus números van del ${r.inicio} al ${r.fin}`;
        aviso.className = 'aviso-rango ok';
      }
    });

    document.getElementById('numero').addEventListener('input', (e) => {
      const aviso = document.getElementById('avisoRango');
      const nombre = document.getElementById('vendedora').value;
      const num = parseInt(e.target.value);
      if (!nombre || !num) { aviso.className = 'aviso-rango'; return; }
      const r = rangos.find(x => x.nombre === nombre);
      if (!r) return;
      if (num < r.inicio || num > r.fin) {
        aviso.textContent = `❌ Ese número no te corresponde. Tus números van del ${r.inicio} al ${r.fin}.`;
        aviso.className = 'aviso-rango error';
      } else if (vendidos.includes(num)) {
        aviso.textContent = `❌ Ese número ya fue registrado.`;
        aviso.className = 'aviso-rango error';
      } else {
        aviso.textContent = `✅ Número disponible.`;
        aviso.className = 'aviso-rango ok';
      }
    });

    document.querySelectorAll('input[name="tipoPago"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        document.querySelectorAll('.radio-option').forEach(el => el.classList.remove('selected'));
        e.target.closest('.radio-option').classList.add('selected');
        const grupoFoto = document.getElementById('grupoFoto');
        grupoFoto.style.display = e.target.value === 'foto' ? 'block' : 'none';
      });
    });
    document.getElementById('optFoto').classList.add('selected');

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('formVenta').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnRegistrar');
      const mensajeDiv = document.getElementById('mensaje');

      const vendedora = document.getElementById('vendedora').value;
      const numero = parseInt(document.getElementById('numero').value);
      const cliente = document.getElementById('cliente').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const tipoPago = document.querySelector('input[name="tipoPago"]:checked').value;
      const fotoInput = document.getElementById('foto');

      if (!vendedora) { mostrarMensaje('Seleccioná tu nombre.', 'error'); return; }
      if (!numero) { mostrarMensaje('Ingresá el número vendido.', 'error'); return; }
      if (!cliente) { mostrarMensaje('Ingresá el nombre del comprador.', 'error'); return; }
      if (!telefono) { mostrarMensaje('Ingresá el teléfono del comprador.', 'error'); return; }

      const r = rangos.find(x => x.nombre === vendedora);
      if (numero < r.inicio || numero > r.fin) {
        mostrarMensaje(`Ese número no te corresponde. Tus números van del ${r.inicio} al ${r.fin}.`, 'error');
        return;
      }
      if (vendidos.includes(numero)) {
        mostrarMensaje('Ese número ya fue registrado.', 'error');
        return;
      }
      if (tipoPago === 'foto' && !fotoInput.files[0]) {
        mostrarMensaje('Subí la foto del comprobante o elegí "Entregaré el dinero en efectivo".', 'error');
        return;
      }

      let imagenBase64 = null;
      let imagenNombre = null;
      if (tipoPago === 'foto' && fotoInput.files[0]) {
        imagenBase64 = await fileToBase64(fotoInput.files[0]);
        imagenNombre = fotoInput.files[0].name;
      }

      const payload = {
        vendedora,
        numero,
        cliente,
        telefono,
        tipoPago,
        imagenBase64,
        imagenNombre
      };

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span><span>Registrando...</span>';
      mensajeDiv.style.display = 'none';

      try {
        await fetch(URL_SCRIPT, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        mostrarMensaje(`✅ Número ${numero} vendido a ${cliente} — Pendiente. ¡Gracias!`, 'exito');
        document.getElementById('numero').value = '';
        document.getElementById('cliente').value = '';
        document.getElementById('telefono').value = '';
        document.getElementById('foto').value = '';
        document.getElementById('avisoRango').className = 'aviso-rango';
        await cargarDatos();
      } catch (error) {
        console.error(error);
        mostrarMensaje('Hubo un problema al registrar. Verificá tu conexión e intentá de nuevo.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Registrar venta</span>';
      }
    });

    function mostrarMensaje(texto, tipo) {
      const div = document.getElementById('mensaje');
      div.textContent = texto;
      div.className = 'mensaje ' + tipo;
      div.style.display = 'flex';
      setTimeout(() => { div.style.display = 'none'; }, 8000);
    }

    cargarDatos().catch(err => {
      console.error(err);
      mostrarMensaje('No se pudieron cargar los datos. Verificá la URL del script.', 'error');
    });
  </script>
</body>
</html>
